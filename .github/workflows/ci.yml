name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -yq clang-format

      - name: Check formatting (clang-format)
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking formatting with clang-format..."
          # Find typical C/C++ source and header files tracked by git
          mapfile -t paths < <(git ls-files | grep -E '\\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' || true)
          if [ ${#paths[@]} -eq 0 ]; then
            echo "No C/C++ files to check."
            exit 0
          fi
          # Run clang-format in check mode; fail on any diff
          printf '%s\0' "${paths[@]}" | xargs -0 -r clang-format -style=file -n --Werror

  build-and-test:
    runs-on: ubuntu-latest
    needs: check-format

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh"

      - name: Preinstall dependencies (manifest mode)
        working-directory: ${{ github.workspace }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_FEATURE_FLAGS: manifests
        run: |
          "${{ github.workspace }}/vcpkg/vcpkg" install

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -yq libboost-all-dev

      - name: Configure CMake
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_FEATURE_FLAGS: manifests
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}}

